name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, first, and independent of any build or of Loom: the repository refuses to
  # record an AI assistant as a commit co-author, and after HIST-2 that is true of all of
  # main. The check self-tests before it answers, because a clean history and a broken
  # detector look identical from here. Full history is required -- it states the invariant
  # over everything reachable, not just today's push. Deliberately not `needs: resolve-loom`
  # and deliberately not a step inside the stranger lane: it must answer in seconds even
  # when the build lanes are red, and the stranger lane's whole claim is that it needs
  # nothing but source and an installed Loom.
  zengine-commit-attribution:
    name: Zengine / commit attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Zengine with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse AI co-authorship in reachable history
        run: cmake -P tests/check_commit_attribution.cmake

  resolve-loom:
    name: Resolve canonical Loom
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.loom.outputs.sha }}
    steps:
      - name: Resolve Loom main once for this run
        id: loom
        run: |
          loom_sha="$(git ls-remote https://github.com/Krealsion/Loom.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ ! "$loom_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve canonical Loom main" >&2
            exit 1
          fi
          echo "Canonical Loom: $loom_sha"
          echo "sha=$loom_sha" >> "$GITHUB_OUTPUT"

  zengine-linux-stranger:
    name: Zengine / Linux / canonical Loom stranger
    needs: resolve-loom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      - name: Fetch pinned canonical Loom
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          loom_source="$RUNNER_TEMP/loom-src"
          git init "$loom_source"
          git -C "$loom_source" remote add origin https://github.com/Krealsion/Loom.git
          git -C "$loom_source" fetch --depth=1 origin "$LOOM_SHA"
          git -C "$loom_source" checkout --detach FETCH_HEAD
          test "$(git -C "$loom_source" rev-parse HEAD)" = "$LOOM_SHA"

      - name: Build and install Loom to a fresh prefix
        run: |
          loom_prefix="$RUNNER_TEMP/loom-prefix"
          test ! -e "$loom_prefix"
          cmake -S "$RUNNER_TEMP/loom-src" -B "$RUNNER_TEMP/loom-build" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/loom-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/loom-build" --prefix "$loom_prefix"

      - name: Configure Zengine as a stranger
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loom-prefix" \
            -DZEN_LOOM_DEV=OFF \
            -DBUILD_TESTING=ON

      - name: Build Zengine
        run: cmake --build build --parallel "$(nproc)"

      # The repository-owned lane, not a bare ctest: it also requires that the CTest
      # inventory match tests/test_population.txt, that every doctest surface clear
      # its case floor, and that each of them still refuse an empty population. No
      # expected counts live in this file -- they live in the manifest, which is what
      # keeps them out of reach of an edit that deletes a registration (COLD-2 C-4).
      - name: Verify the repository-owned population
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Zengine / Linux / canonical Loom stranger\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|population:|cases \(floor|judged on|[0-9]+% tests passed|test cases:|assertions:|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  # THE STANDING SANITIZER WITNESS (W-3a). Deliberately a separate job rather than a
  # second step in the one above: the ordinary lane's result must stay readable on its
  # own, and these two answer different questions. `verify.cmake` asks whether the
  # population this repository meant to run existed, ran and passed; it cannot ask
  # whether the code that passed did so while reading freed memory or overflowing a
  # signed int, because there the symptom is that NO answer changes.
  #
  # The cost of not asking is measured twice: W-2's heap-use-after-free in committed
  # test code and W-3's signed-overflow UB in ui::Rect::contains, on the ordinary
  # Workshop press path. Both were found by hand-built sanitizer trees that lasted one
  # phase, and both had been called green by the job above. This is that tree, owned by
  # the repository.
  #
  # It runs the SAME population under instrumentation -- no subset, no lowered floor, no
  # gate turned off, SDL skin included -- so a red here is about the code and never about
  # the lane having quietly shrunk.
  zengine-linux-asan-ubsan:
    name: Zengine / Linux / ASan + UBSan
    needs: resolve-loom
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      - name: Fetch pinned canonical Loom
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          loom_source="$RUNNER_TEMP/loom-src"
          git init "$loom_source"
          git -C "$loom_source" remote add origin https://github.com/Krealsion/Loom.git
          git -C "$loom_source" fetch --depth=1 origin "$LOOM_SHA"
          git -C "$loom_source" checkout --detach FETCH_HEAD
          test "$(git -C "$loom_source" rev-parse HEAD)" = "$LOOM_SHA"

      # An ordinary Loom, not a sanitized one, and that is the honest boundary rather
      # than an oversight: this lane instruments the targets Zengine AUTHORS, and the
      # Loom runs the identical lane over itself in its own repository. ASan's allocator
      # is process-wide regardless, so a Loom allocation freed and then read by Zengine
      # code is still caught here.
      - name: Build and install Loom to a fresh prefix
        run: |
          loom_prefix="$RUNNER_TEMP/loom-prefix"
          test ! -e "$loom_prefix"
          cmake -S "$RUNNER_TEMP/loom-src" -B "$RUNNER_TEMP/loom-build" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/loom-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/loom-build" --prefix "$loom_prefix"

      - name: Configure Zengine as a stranger, instrumented
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loom-prefix" \
            -DZEN_LOOM_DEV=OFF \
            -DBUILD_TESTING=ON \
            -DZENGINE_SANITIZE=ON

      - name: Build Zengine
        run: cmake --build build-san --parallel "$(nproc)"

      - name: Verify the repository-owned population under ASan + UBSan
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build-san -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Zengine / Linux / ASan + UBSan\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|population:|cases \(floor|judged on|[0-9]+% tests passed|test cases:|assertions:|DECLARED ABSENT|Total Test time|runtime error:|ERROR: AddressSanitizer' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  zengine-windows-stranger:
    name: Zengine / Windows / canonical Loom stranger (advisory)
    needs: resolve-loom
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MinGW-w64 toolchain
        shell: pwsh
        run: |
          & 'C:\mingw64\bin\g++.exe' --version
          cmake --version
          & 'C:\mingw64\bin\nm.exe' --version
          ninja --version

      - name: Fetch pinned canonical Loom
        shell: pwsh
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src'
          git init $loomSource
          git -C $loomSource remote add origin https://github.com/Krealsion/Loom.git
          git -C $loomSource fetch --depth=1 origin $env:LOOM_SHA
          git -C $loomSource checkout --detach FETCH_HEAD
          $actual = git -C $loomSource rev-parse HEAD
          if ($actual -ne $env:LOOM_SHA) {
            throw "Expected Loom $env:LOOM_SHA, got $actual"
          }

      - name: Build and install kernel-full Loom to a fresh prefix
        shell: pwsh
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src'
          $loomBuild = Join-Path $env:RUNNER_TEMP 'loom-build'
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix'
          if (Test-Path -LiteralPath $loomPrefix) {
            throw "Fresh Loom prefix already exists: $loomPrefix"
          }
          cmake -S $loomSource -B $loomBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe `
            -DLOOM_ENABLE_WINDOWS_KERNEL=ON
          cmake --build $loomBuild
          cmake --install $loomBuild --prefix $loomPrefix

      - name: Configure Zengine as a stranger with MinGW-w64
        shell: pwsh
        run: |
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix'
          cmake -S . -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe `
            "-DCMAKE_PREFIX_PATH=$loomPrefix" `
            -DZEN_LOOM_DEV=OFF `
            -DBUILD_TESTING=ON `
            -DZENGINE_SDL_SKIN=OFF

      - name: Build Zengine
        run: cmake --build build-win

      # Advisory, and it verifies the same repository-owned population -- with the
      # `sdl` gate off, so the SDL-gated suites are contractually smaller here than on
      # Linux. That difference is declared in tests/test_population.txt, not absorbed
      # into a slack floor, so advisory green means the same test-population thing. The
      # numbers are in that file; a workflow comment that repeated them would be one
      # more copy to go stale, and this one had.
      - name: Verify the repository-owned population
        run: cmake -DZEN_BUILD_DIR=build-win -P tests/verify.cmake

  # The MSVC stranger (MSVC-0). The same shape as the MinGW job above, and that is the
  # claim: Zengine carries NO MSVC-specific compile option of its own. Loom's public
  # macro surface needs /Zc:preprocessor and `loom::core` exports it as an interface
  # requirement, so this lane going green while this file adds nothing is exactly the
  # evidence that the package -- not the consumer -- owns that law. If this job ever
  # needs a flag added here to pass, the requirement has stopped riding the package and
  # the fix belongs in Loom.
  zengine-windows-msvc-stranger:
    name: Zengine / Windows / MSVC Loom stranger (advisory)
    needs: resolve-loom
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MSVC toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No MSVC x64 toolset on this image" }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cl 2>&1 | Select-Object -First 2
          cmake --version
          ninja --version

      - name: Fetch pinned canonical Loom
        shell: pwsh
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src-msvc'
          git init $loomSource
          git -C $loomSource remote add origin https://github.com/Krealsion/Loom.git
          git -C $loomSource fetch --depth=1 origin $env:LOOM_SHA
          git -C $loomSource checkout --detach FETCH_HEAD
          $actual = git -C $loomSource rev-parse HEAD
          if ($actual -ne $env:LOOM_SHA) {
            throw "Expected Loom $env:LOOM_SHA, got $actual"
          }

      - name: Build and install kernel-full Loom to a fresh prefix with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src-msvc'
          $loomBuild = Join-Path $env:RUNNER_TEMP 'loom-build-msvc'
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix-msvc'
          if (Test-Path -LiteralPath $loomPrefix) {
            throw "Fresh Loom prefix already exists: $loomPrefix"
          }
          cmake -S $loomSource -B $loomBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DZEN_BUILD_TESTS=OFF `
            -DZEN_BUILD_EXAMPLES=OFF `
            -DLOOM_ENABLE_WINDOWS_KERNEL=ON
          cmake --build $loomBuild
          cmake --install $loomBuild --prefix $loomPrefix

      - name: Configure and build Zengine as a stranger with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix-msvc'
          cmake -S . -B build-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            "-DCMAKE_PREFIX_PATH=$loomPrefix" `
            -DZEN_LOOM_DEV=OFF `
            -DBUILD_TESTING=ON `
            -DZENGINE_SDL_SKIN=OFF
          cmake --build build-msvc

      - name: Verify the repository-owned population
        shell: pwsh
        run: cmake -DZEN_BUILD_DIR=build-msvc -P tests/verify.cmake
