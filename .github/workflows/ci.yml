name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # A nightly run on `main` keeps the compiler caches it writes from expiring while `main` is quiet,
  # and is the run in which the MSVC stranger builds with nothing added (its job says why).
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

# A pull request's newer push cancels its run in progress. A push to `main` has a group of its own,
# so no run on `main` waits behind another and is replaced before it starts: each judges and builds
# its own push (VM-LANE-06).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, first, and independent of any build or of Loom: the repository refuses a commit
  # co-author line and an AI credit, over all of main. The check self-tests before it
  # answers, because a clean history and a broken detector look identical from here, and
  # needs full history to state the invariant over everything reachable. Deliberately not
  # `needs: resolve-loom` and not a step in the stranger lane: it answers in seconds even when
  # the build lanes are red, and the stranger lane needs nothing but source and a Loom.
  zengine-commit-attribution:
    name: Zengine / commit attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Zengine with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse co-author lines and AI credit in reachable history
        run: cmake -P tests/check_commit_attribution.cmake

  # Does the change touch a compiled line? tests/check_change_kind.cmake answers from the base (a
  # pull request's merge parent, or the push's previous tip) to this commit; only its explicit
  # `false` skips the build and test jobs, so a broken answer runs them all.
  zengine-change-kind:
    name: Zengine / change kind
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compiled: ${{ steps.kind.outputs.compiled }}
    steps:
      - name: Check out Zengine with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BEFORE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; every job runs."
            echo "compiled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmake -DZEN_BASE="$base" -DZEN_HEAD=HEAD -DZEN_KIND_OUT="$GITHUB_OUTPUT" -P tests/check_change_kind.cmake

  # The documentation lane's checks, on every change: they read the source tree, not a build.
  zengine-documentation:
    name: Zengine / documentation lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the text checks
        run: cmake -DZEN_LANE_KIND=OFF -P tests/documentation_lane.cmake

  resolve-loom:
    name: Resolve canonical Loom
    needs: zengine-change-kind
    if: ${{ !cancelled() && needs.zengine-change-kind.outputs.compiled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.loom.outputs.sha }}
    steps:
      - name: Resolve Loom main once for this run
        id: loom
        run: |
          loom_sha="$(git ls-remote https://github.com/Krealsion/Loom.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ ! "$loom_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve canonical Loom main" >&2
            exit 1
          fi
          echo "Canonical Loom: $loom_sha"
          echo "sha=$loom_sha" >> "$GITHUB_OUTPUT"
          echo "$loom_sha" > "$RUNNER_TEMP/loom-commit.txt"

      # ...and kept as a one-line file: the nightly package (package.yml) builds a commit this run
      # passed against the Loom this run built it with, read back from here.
      - name: Keep the Loom commit this run builds against
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-commit
          path: ${{ runner.temp }}/loom-commit.txt
          if-no-files-found: error
          retention-days: 30

  zengine-linux-stranger:
    name: Zengine / Linux / canonical Loom stranger
    needs: [zengine-change-kind, resolve-loom]
    if: ${{ !cancelled() && needs.zengine-change-kind.outputs.compiled != 'false' && needs.resolve-loom.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      - name: Fetch pinned canonical Loom
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          loom_source="$RUNNER_TEMP/loom-src"
          git init "$loom_source"
          git -C "$loom_source" remote add origin https://github.com/Krealsion/Loom.git
          git -C "$loom_source" fetch --depth=1 origin "$LOOM_SHA"
          git -C "$loom_source" checkout --detach FETCH_HEAD
          test "$(git -C "$loom_source" rev-parse HEAD)" = "$LOOM_SHA"

      # Loom's tests and examples stay off, as in both Windows jobs: Zengine consumes the installed
      # prefix alone, and Loom runs its own lanes in its own repository.
      #
      # NO DEBUG INFORMATION in the GCC jobs, LINE TABLES in the sanitizer's (VM-LANE-26): no job
      # reads debug information -- a failing case names its file and line from the source, and
      # nothing in Zengine or its Loom reads it as it runs -- so this job builds with `-g0`, and the
      # ASan job with `-g1`, which keeps the line table its reports name file and line from. Only
      # these configure lines set it; Zengine's CMake and a weaver's Debug build keep CMake's `-g`.
      - name: Build and install Loom to a fresh prefix
        run: |
          loom_prefix="$RUNNER_TEMP/loom-prefix"
          test ! -e "$loom_prefix"
          cmake -S "$RUNNER_TEMP/loom-src" -B "$RUNNER_TEMP/loom-build" -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG=-g0 \
            -DZEN_BUILD_TESTS=OFF -DZEN_BUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/loom-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/loom-build" --prefix "$loom_prefix"

      # THE `neovim` GATE OPENS HERE, on one Neovim release pinned by its checksum: the suites
      # that need a real Neovim (`neovim_live`, the gated half of `workshop_neovim`) are part of
      # this lane's population rather than declared absent. The program is the release's own
      # tarball, extracted under $RUNNER_TEMP and named at configure time; nothing is installed
      # on the runner, and every case sandboxes the Neovim it starts.
      - name: Fetch pinned Neovim 0.11.6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version

      # THE COMPILER CACHE holds intermediates only: objects ccache keys by the compiler's bytes
      # (its `content` check, not the compiler's file time), its command line and every byte the
      # source read. One store per job and compiler, named by a digest of the bytes of the compilers
      # the configure finds; the runner image is no part of the name, so a runner on a new image
      # with the same compiler restores `main`'s newest store and rebuilds only what the image
      # changed. Every run restores the newest store `main` saved for its job and compiler; only a
      # run on `main` saves one, and a pull request's run never does. A product is never taken from
      # it: the objects only feed this job's links, and Loom's build above has no launcher.
      - name: Fetch pinned ccache 4.13.6
        id: ccache
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.tar.xz" \
            https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
          echo "156ec57c5198cc849d92834023d09910b83dc5504c6cf405d09e6ae7b208a3e5  $RUNNER_TEMP/ccache.tar.xz" \
            | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/ccache-bin"
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP/ccache-bin" --strip-components=1
          "$RUNNER_TEMP/ccache-bin/ccache" --version | head -n 1
          compilers="$(readlink -f "$(command -v cc)") $(readlink -f "$(command -v c++)")"
          compiler="$(sha256sum $compilers | cut -d ' ' -f 1 | sha256sum | cut -c 1-16)"
          echo "Runner image $ImageOS-$ImageVersion; compilers $compilers ($(c++ --version | head -n 1)); store compiler $compiler"
          {
            echo "ZEN_CCACHE=$RUNNER_TEMP/ccache-bin/ccache"
            echo "ZEN_CCACHE_SINCE=$(date +%s)"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-debug-${{ steps.ccache.outputs.compiler }}-

      - name: Configure Zengine as a stranger
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG=-g0 \
            -DCMAKE_CXX_FLAGS_DEBUG=-g0 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loom-prefix" \
            -DCMAKE_C_COMPILER_LAUNCHER="$ZEN_CCACHE" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$ZEN_CCACHE" \
            -DZEN_LOOM_DEV=OFF \
            -DBUILD_TESTING=ON \
            -DZENGINE_NEOVIM_PROGRAM="$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim"

      - name: Build Zengine
        run: |
          "$ZEN_CCACHE" --zero-stats
          cmake --build build --parallel "$(nproc)"
          {
            printf '## Zengine / Linux / canonical Loom stranger: the compiler cache\n\n```text\n'
            "$ZEN_CCACHE" --show-stats --verbose
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # The repository-owned lane, not a bare ctest: it also requires that the CTest
      # inventory match tests/test_population.txt, that every doctest surface clear
      # its case floor, and that each of them still refuse an empty population. No
      # expected counts live in this file -- they live in the manifest, which keeps them
      # out of reach of an edit that deletes a registration. Four entries at a time
      # (VM-LANE-11), every entry in the one pool; an entry that cannot share the machine
      # would be named in `-DZEN_CTEST_APART` and run alone after the rest.
      - name: Verify the repository-owned population
        id: verify
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build -DZEN_CTEST_ARGS=-j4 -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Zengine / Linux / canonical Loom stranger\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|population:|cases \(floor|judged on|[0-9]+% tests passed|test cases:|assertions:|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

      # A RED VERIFICATION KEEPS WHAT THE JOURNEYS LEFT: each journey's roots -- the Workshop and
      # host it launched, their logs and files -- and its evidence, read after the job ends. The
      # tutorial walks' work holds an installed prefix and is left out. One archive, since the
      # roots' names hold characters the artifact store refuses in a path.
      - name: Pack the journeys' work folders of a failed verification
        id: journeys
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        continue-on-error: true
        run: |
          shopt -s nullglob
          cd build
          kept=()
          for f in *-journey-work *-journey.json tutor-walk-work tutor-walk.json; do
            if [ -e "$f" ]; then kept+=("$f"); fi
          done
          if (( ${#kept[@]} )); then
            tar -czf "$RUNNER_TEMP/journey-work.tar.gz" -- "${kept[@]}"
            echo packed=true >> "$GITHUB_OUTPUT"
          fi

      - name: Keep them as an artifact of the run
        if: ${{ failure() && steps.journeys.outputs.packed == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-work-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journey-work.tar.gz
          if-no-files-found: error
          retention-days: 14

      # THE INSTALLED-PACKAGE WITNESS asks what the step above cannot: `verify.cmake` reaches
      # Zengine through its own build tree, so a requirement the PACKAGE fails to carry is
      # invisible there. This installs into an isolated prefix, builds an unrelated project
      # OUTSIDE the checkout against it alone, runs it, repeats against a moved prefix, and
      # deletes one installed header to prove the source tree was not quietly read.
      # $RUNNER_TEMP, because the driver refuses a work directory inside the repository.
      - name: Witness the installed package from outside the tree
        run: |
          cmake -DZEN_BUILD_DIR=build -DZEN_WORK="$RUNNER_TEMP/zengine-package" -P tests/package/run.cmake

      # Only `main` saves, and only what this run used: entries no compile read since the job began
      # are dropped first, so the store follows `main`.
      - name: Keep only what this run used
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          "$ZEN_CCACHE" --evict-older-than "$(( $(date +%s) - ZEN_CCACHE_SINCE + 60 ))s"
          "$ZEN_CCACHE" --show-stats

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

  # THE STANDING SANITIZER WITNESS, a separate job so the ordinary lane's result stays
  # readable on its own: `verify.cmake` asks whether the intended population ran and passed,
  # not whether it read freed memory or overflowed a signed int, where NO answer changes --
  # defects of that kind, in test code and on the press path, the lane above had called
  # green. It runs the SAME population, no subset, no lowered floor, no gate off, SDL skin
  # included, so a red here is about the code and never about a lane that quietly shrank.
  zengine-linux-asan-ubsan:
    name: Zengine / Linux / ASan + UBSan
    needs: [zengine-change-kind, resolve-loom]
    if: ${{ !cancelled() && needs.zengine-change-kind.outputs.compiled != 'false' && needs.resolve-loom.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      - name: Fetch pinned canonical Loom
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          loom_source="$RUNNER_TEMP/loom-src"
          git init "$loom_source"
          git -C "$loom_source" remote add origin https://github.com/Krealsion/Loom.git
          git -C "$loom_source" fetch --depth=1 origin "$LOOM_SHA"
          git -C "$loom_source" checkout --detach FETCH_HEAD
          test "$(git -C "$loom_source" rev-parse HEAD)" = "$LOOM_SHA"

      # An ordinary Loom, not a sanitized one, and that is the honest boundary rather
      # than an oversight: this lane instruments the targets Zengine AUTHORS, and the
      # Loom runs the identical lane over itself in its own repository. ASan's allocator
      # is process-wide regardless, so a Loom allocation freed and then read by Zengine
      # code is still caught here. Line tables, so its reports name file and line (VM-LANE-26).
      - name: Build and install Loom to a fresh prefix
        run: |
          loom_prefix="$RUNNER_TEMP/loom-prefix"
          test ! -e "$loom_prefix"
          cmake -S "$RUNNER_TEMP/loom-src" -B "$RUNNER_TEMP/loom-build" -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DZEN_BUILD_TESTS=OFF -DZEN_BUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/loom-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/loom-build" --prefix "$loom_prefix"

      # The same pinned Neovim as the stranger lane, so the instrumented population is the same
      # population: the `neovim` gate is open here too.
      - name: Fetch pinned Neovim 0.11.6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
          echo "2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc  $RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version

      # The compiler cache as in the stranger lane, in a store of this job's own.
      - name: Fetch pinned ccache 4.13.6
        id: ccache
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.tar.xz" \
            https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
          echo "156ec57c5198cc849d92834023d09910b83dc5504c6cf405d09e6ae7b208a3e5  $RUNNER_TEMP/ccache.tar.xz" \
            | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/ccache-bin"
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP/ccache-bin" --strip-components=1
          "$RUNNER_TEMP/ccache-bin/ccache" --version | head -n 1
          compilers="$(readlink -f "$(command -v cc)") $(readlink -f "$(command -v c++)")"
          compiler="$(sha256sum $compilers | cut -d ' ' -f 1 | sha256sum | cut -c 1-16)"
          echo "Runner image $ImageOS-$ImageVersion; compilers $compilers ($(c++ --version | head -n 1)); store compiler $compiler"
          {
            echo "ZEN_CCACHE=$RUNNER_TEMP/ccache-bin/ccache"
            echo "ZEN_CCACHE_SINCE=$(date +%s)"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-asan-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-asan-${{ steps.ccache.outputs.compiler }}-

      - name: Configure Zengine as a stranger, instrumented
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG=-g1 \
            -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loom-prefix" \
            -DCMAKE_C_COMPILER_LAUNCHER="$ZEN_CCACHE" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$ZEN_CCACHE" \
            -DZEN_LOOM_DEV=OFF \
            -DBUILD_TESTING=ON \
            -DZENGINE_SANITIZE=ON \
            -DZENGINE_NEOVIM_PROGRAM="$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim"

      - name: Build Zengine
        run: |
          "$ZEN_CCACHE" --zero-stats
          cmake --build build-san --parallel "$(nproc)"
          {
            printf '## Zengine / Linux / ASan + UBSan: the compiler cache\n\n```text\n'
            "$ZEN_CCACHE" --show-stats --verbose
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every entry in the one pool, four at a time, as in the stranger lane.
      - name: Verify the repository-owned population under ASan + UBSan
        id: verify
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build-san -DZEN_CTEST_ARGS=-j4 -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Zengine / Linux / ASan + UBSan\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|population:|cases \(floor|judged on|[0-9]+% tests passed|test cases:|assertions:|DECLARED ABSENT|Total Test time|runtime error:|ERROR: AddressSanitizer' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

      # As the stranger lane's: a red verification keeps the journeys' roots and evidence.
      - name: Pack the journeys' work folders of a failed verification
        id: journeys
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        continue-on-error: true
        run: |
          shopt -s nullglob
          cd build-san
          kept=()
          for f in *-journey-work *-journey.json tutor-walk-work tutor-walk.json; do
            if [ -e "$f" ]; then kept+=("$f"); fi
          done
          if (( ${#kept[@]} )); then
            tar -czf "$RUNNER_TEMP/journey-work.tar.gz" -- "${kept[@]}"
            echo packed=true >> "$GITHUB_OUTPUT"
          fi

      - name: Keep them as an artifact of the run
        if: ${{ failure() && steps.journeys.outputs.packed == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-work-sanitizer-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journey-work.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Keep only what this run used
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          "$ZEN_CCACHE" --evict-older-than "$(( $(date +%s) - ZEN_CCACHE_SINCE + 60 ))s"
          "$ZEN_CCACHE" --show-stats

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-asan-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

  # THE TWO WINDOWS LANES ARE TWO STANDARD LIBRARIES, and a claim about "Windows" names the
  # one it was measured on. MinGW-w64/libstdc++ is the maintainers' daily build, so this lane is
  # REQUIRED; MSVC, the toolchain released Windows users build with, stays ADVISORY until it
  # can be proven locally as a matter of course. The two libraries answer the filesystem
  # differently (libstdc++ reports a directory junction as an ordinary directory, MSVC's STL
  # as a junction), and a red that cannot fail the run is not a lane.
  zengine-windows-stranger:
    name: Zengine / Windows / MinGW-w64 Loom stranger
    needs: [zengine-change-kind, resolve-loom]
    if: ${{ !cancelled() && needs.zengine-change-kind.outputs.compiled != 'false' && needs.resolve-loom.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MinGW-w64 toolchain
        shell: pwsh
        run: |
          & 'C:\mingw64\bin\g++.exe' --version
          cmake --version
          & 'C:\mingw64\bin\nm.exe' --version
          ninja --version

      - name: Fetch pinned canonical Loom
        shell: pwsh
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src'
          git init $loomSource
          git -C $loomSource remote add origin https://github.com/Krealsion/Loom.git
          git -C $loomSource fetch --depth=1 origin $env:LOOM_SHA
          git -C $loomSource checkout --detach FETCH_HEAD
          $actual = git -C $loomSource rev-parse HEAD
          if ($actual -ne $env:LOOM_SHA) {
            throw "Expected Loom $env:LOOM_SHA, got $actual"
          }

      # No debug information, as in the Linux stranger lane (VM-LANE-26).
      - name: Build and install kernel-full Loom to a fresh prefix
        shell: pwsh
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src'
          $loomBuild = Join-Path $env:RUNNER_TEMP 'loom-build'
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix'
          if (Test-Path -LiteralPath $loomPrefix) {
            throw "Fresh Loom prefix already exists: $loomPrefix"
          }
          cmake -S $loomSource -B $loomBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_CXX_FLAGS_DEBUG=-g0 `
            -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe `
            -DZEN_BUILD_TESTS=OFF `
            -DZEN_BUILD_EXAMPLES=OFF `
            -DLOOM_ENABLE_WINDOWS_KERNEL=ON
          cmake --build $loomBuild
          cmake --install $loomBuild --prefix $loomPrefix

      # The compiler cache as in the Linux lanes, in a store of this job's own.
      - name: Fetch pinned ccache 4.13.6
        id: ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'ccache-bin'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-windows-x86_64.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sha -ne '3d7cebb05850ad704e197b3f1d3f0f924ab6c9fdfc561578e146184fe9d89380') {
            throw "ccache archive checksum $sha does not match the pin"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          $exe = (Get-ChildItem -LiteralPath $bin -Recurse -Filter ccache.exe | Select-Object -First 1).FullName
          & $exe --version | Select-Object -First 1
          $compilers = 'C:/mingw64/bin/gcc.exe', 'C:/mingw64/bin/g++.exe'
          $digests = ($compilers | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant() }) -join "`n"
          $compiler = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($digests))).Substring(0, 16).ToLowerInvariant()
          "Runner image $env:ImageOS-$env:ImageVersion; compilers $($compilers -join ' ') ($(& $compilers[1] --version | Select-Object -First 1)); store compiler $compiler"
          "ZEN_CCACHE=$($exe -replace '\\', '/')" >> $env:GITHUB_ENV
          "ZEN_CCACHE_SINCE=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ccache')" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=3G" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mingw-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-mingw-debug-${{ steps.ccache.outputs.compiler }}-

      - name: Configure Zengine as a stranger with MinGW-w64
        shell: pwsh
        run: |
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix'
          cmake -S . -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_FLAGS_DEBUG=-g0 `
            -DCMAKE_CXX_FLAGS_DEBUG=-g0 `
            -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe `
            "-DCMAKE_C_COMPILER_LAUNCHER=$env:ZEN_CCACHE" `
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:ZEN_CCACHE" `
            "-DCMAKE_PREFIX_PATH=$loomPrefix" `
            -DZEN_LOOM_DEV=OFF `
            -DBUILD_TESTING=ON `
            -DZENGINE_SDL_SKIN=OFF

      - name: Build Zengine
        shell: pwsh
        run: |
          & $env:ZEN_CCACHE --zero-stats
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Zengine / Windows / MinGW-w64 Loom stranger: the compiler cache`n`n``````text" >> $env:GITHUB_STEP_SUMMARY
          & $env:ZEN_CCACHE --show-stats --verbose >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      # Required, and it verifies the same repository-owned population -- with the `sdl` and
      # `neovim` gates off, so the SDL-gated suites are contractually smaller here than on
      # Linux and the Neovim-gated ones are absent (this runner has no Neovim). That
      # difference is declared in tests/test_population.txt, not absorbed into a slack floor,
      # so a green here means the same thing; the numbers live in that file and nowhere else.
      # Four entries at a time, every entry in the one pool, as in every build job (VM-LANE-11).
      - name: Verify the repository-owned population
        run: cmake -DZEN_BUILD_DIR=build-win -DZEN_CTEST_ARGS=-j4 -P tests/verify.cmake

      - name: Keep only what this run used
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:ZEN_CCACHE_SINCE + 60
          & $env:ZEN_CCACHE --evict-older-than "${age}s"
          & $env:ZEN_CCACHE --show-stats

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mingw-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The MSVC stranger, ADVISORY: MSVC is the toolchain released Windows users build with, but
  # not the maintainers' daily build, so a red here cannot yet be proven or repaired locally as a
  # matter of course -- `continue-on-error` stays until it can. The same shape as the MinGW
  # job: Zengine carries NO MSVC-specific compile option. Loom's macro surface needs
  # /Zc:preprocessor and `loom::core` exports it, so a green with nothing added is the evidence
  # the package owns that law; a flag this job needs belongs in Loom.
  # TWO RUNS OF ONE JOB. The nightly run on `main` is that stranger: nothing added, and its
  # verdict heads the run's summary. Every other run is a stranger who adds two things on the
  # configure line, and only there: ccache as the launcher, and each object's debug information
  # embedded (CMP0141's /Z7), the one format ccache can keep for MSVC. Neither names a symbol, a
  # definition or a `/Zc` switch, so neither can stand in for what Loom exports. The cache's rules
  # are the other jobs' (VM-LANE-23, VM-LANE-24), in a store of this job's own; the nightly run's
  # place is VM-LANE-25's.
  zengine-windows-msvc-stranger:
    name: ${{ github.event_name == 'schedule' && 'Zengine / Windows / MSVC Loom stranger, nothing added (advisory -- the released toolchain, not the maintainers'' local build)' || 'Zengine / Windows / MSVC Loom stranger (advisory -- the released toolchain, not the maintainers'' local build)' }}
    needs: [zengine-change-kind, resolve-loom]
    if: ${{ !cancelled() && needs.zengine-change-kind.outputs.compiled != 'false' && needs.resolve-loom.result == 'success' }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    env:
      ZEN_MSVC_BARE: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Check out Zengine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MSVC toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No MSVC x64 toolset on this image" }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cl 2>&1 | Select-Object -First 2
          cmake --version
          ninja --version

      - name: Fetch pinned canonical Loom
        shell: pwsh
        env:
          LOOM_SHA: ${{ needs.resolve-loom.outputs.sha }}
        run: |
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src-msvc'
          git init $loomSource
          git -C $loomSource remote add origin https://github.com/Krealsion/Loom.git
          git -C $loomSource fetch --depth=1 origin $env:LOOM_SHA
          git -C $loomSource checkout --detach FETCH_HEAD
          $actual = git -C $loomSource rev-parse HEAD
          if ($actual -ne $env:LOOM_SHA) {
            throw "Expected Loom $env:LOOM_SHA, got $actual"
          }

      - name: Build and install kernel-full Loom to a fresh prefix with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $loomSource = Join-Path $env:RUNNER_TEMP 'loom-src-msvc'
          $loomBuild = Join-Path $env:RUNNER_TEMP 'loom-build-msvc'
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix-msvc'
          if (Test-Path -LiteralPath $loomPrefix) {
            throw "Fresh Loom prefix already exists: $loomPrefix"
          }
          cmake -S $loomSource -B $loomBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DZEN_BUILD_TESTS=OFF `
            -DZEN_BUILD_EXAMPLES=OFF `
            -DLOOM_ENABLE_WINDOWS_KERNEL=ON
          cmake --build $loomBuild
          cmake --install $loomBuild --prefix $loomPrefix

      # The compiler cache as in the MinGW-w64 job, in a store of this job's own, its compiler the
      # `cl.exe` the developer shell finds first; not in the nightly run, which adds nothing.
      - name: Fetch pinned ccache 4.13.6
        id: ccache
        if: ${{ env.ZEN_MSVC_BARE != 'true' }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'ccache-bin'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-windows-x86_64.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sha -ne '3d7cebb05850ad704e197b3f1d3f0f924ab6c9fdfc561578e146184fe9d89380') {
            throw "ccache archive checksum $sha does not match the pin"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          $exe = (Get-ChildItem -LiteralPath $bin -Recurse -Filter ccache.exe | Select-Object -First 1).FullName
          & $exe --version | Select-Object -First 1
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $compilers = @((Get-Command cl.exe).Source)
          $digests = ($compilers | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant() }) -join "`n"
          $compiler = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($digests))).Substring(0, 16).ToLowerInvariant()
          "Runner image $env:ImageOS-$env:ImageVersion; compilers $($compilers -join ' ') (cl.exe $((Get-Item -LiteralPath $compilers[0]).VersionInfo.FileVersion)); store compiler $compiler"
          "ZEN_CCACHE=$($exe -replace '\\', '/')" >> $env:GITHUB_ENV
          "ZEN_CCACHE_SINCE=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ccache')" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=3G" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Restore the compiler cache
        if: ${{ env.ZEN_MSVC_BARE != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-msvc-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-msvc-debug-${{ steps.ccache.outputs.compiler }}-

      - name: Configure Zengine as a stranger with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $loomPrefix = Join-Path $env:RUNNER_TEMP 'loom-prefix-msvc'
          $added = @()
          if ($env:ZEN_MSVC_BARE -ne 'true') {
            $added = @(
              '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
              '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
              "-DCMAKE_C_COMPILER_LAUNCHER=$env:ZEN_CCACHE",
              "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:ZEN_CCACHE")
          }
          "Added to the configure line: $(if ($added) { $added -join ' ' } else { 'nothing' })"
          cmake -S . -B build-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            "-DCMAKE_PREFIX_PATH=$loomPrefix" `
            -DZEN_LOOM_DEV=OFF `
            -DBUILD_TESTING=ON `
            -DZENGINE_SDL_SKIN=OFF `
            @added

      - name: Build Zengine
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          if ($env:ZEN_CCACHE) { & $env:ZEN_CCACHE --zero-stats }
          cmake --build build-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:ZEN_CCACHE) {
            "## Zengine / Windows / MSVC Loom stranger: the compiler cache`n`n``````text" >> $env:GITHUB_STEP_SUMMARY
            & $env:ZEN_CCACHE --show-stats --verbose >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      # THIS STEP NEEDS THE DEV SHELL, the only verify step that does: the compile-negative
      # entries compile AT TEST TIME -- ctest starts a nested build that runs `cl.exe`, which
      # finds the C++ standard headers only through the INCLUDE a VS developer shell sets (the
      # MinGW job names g++ by absolute path, which carries its own roots). Without it the
      # compile entries fail as `C1083: Cannot open include file: 'cstdint'` -- an unset
      # variable that reads like a broken repository, in a lane whose run-only suites pass.
      # Four entries at a time, every entry in the one pool, as in every build job (VM-LANE-11).
      # The verdict heads the run's summary, saying which of the two runs this was.
      - name: Verify the repository-owned population
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cmake -DZEN_BUILD_DIR=build-msvc -DZEN_CTEST_ARGS=-j4 -P tests/verify.cmake
          $rc = $LASTEXITCODE
          $kind = if ($env:ZEN_MSVC_BARE -eq 'true') { 'nothing added' } else { 'the compiler cache and embedded debug information added' }
          $outcome = if ($rc -eq 0) { 'passed' } else { 'failed' }
          "## Zengine / Windows / MSVC Loom stranger, $kind`n`n**Verification:** $outcome (exit $rc)`n" >> $env:GITHUB_STEP_SUMMARY
          exit $rc

      # The installed-package witness on MSVC. Same command as the Linux job, and it has to
      # be: the package's claim is that an unrelated project needs nothing but a prefix, and a
      # Windows-only step here would be one more thing that could be true on one platform and
      # not the other. It needs the dev shell for the reason the step above does -- the
      # stranger it builds is a real compilation.
      - name: Witness the installed package from outside the tree
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $work = Join-Path $env:RUNNER_TEMP 'zengine-package'
          cmake -DZEN_BUILD_DIR=build-msvc "-DZEN_WORK=$work" -P tests/package/run.cmake

      - name: Keep only what this run used
        if: ${{ !cancelled() && env.ZEN_MSVC_BARE != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:ZEN_CCACHE_SINCE + 60
          & $env:ZEN_CCACHE --evict-older-than "${age}s"
          & $env:ZEN_CCACHE --show-stats

      - name: Save the compiler cache
        if: ${{ !cancelled() && env.ZEN_MSVC_BARE != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-msvc-debug-${{ steps.ccache.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
